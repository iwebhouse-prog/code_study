# Alembic configuration. Run from backend/: alembic upgrade head
# The database URL is NOT stored here; env.py reads DATABASE_URL
# from the environment or the repository-root .env file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Files are named by explicit revision id, e.g. `alembic revision --rev-id 001 -m "initial schema"`
# -> versions/001_initial_schema.py
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -q REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
